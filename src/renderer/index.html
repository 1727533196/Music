<!doctype html>
<html class="dark" data-theme="dark" data-theme-mode="system" data-accent="white" lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="./src/assets/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#121314" />
    <script>
      // Resolve saved appearance before the first stylesheet paints.
      let saved = {}
      try {
        saved = JSON.parse(localStorage.getItem('USER_SETTINGS') || '{}') || {}
      } catch {
        /* Invalid or unavailable storage uses the default system appearance. */
      }
      const mode = ['light', 'dark', 'system'].includes(saved.themeMode)
        ? saved.themeMode
        : 'system'
      const accent = ['white', 'graphite', 'violet', 'teal', 'amber'].includes(saved.accentColor)
        ? saved.accentColor
        : 'white'
      const scheme =
        mode === 'system'
          ? matchMedia('(prefers-color-scheme: dark)').matches
            ? 'dark'
            : 'light'
          : mode
      document.documentElement.dataset.theme = scheme
      document.documentElement.dataset.themeMode = mode
      document.documentElement.dataset.accent = accent
      document.documentElement.classList.toggle('dark', scheme === 'dark')
      document.documentElement.style.colorScheme = scheme
      document.querySelector('meta[name="theme-color"]').content =
        scheme === 'dark' ? '#121314' : '#f6f7f8'
    </script>
    <style>
      html {
        background: #121314;
      }
      html[data-theme='light'] {
        background: #f6f7f8;
      }
    </style>
    <title>Tinglan</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
